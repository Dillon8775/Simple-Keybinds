## Mod Menu
### https://modrinth.com/mod/modmenu/versions
modmenu_version=21.0.0-alpha.1
## YetAnotherConfigLib (YACL)
### https://maven.isxander.dev/web/releases/dev/isxander/yet-another-config-lib/
