# Every field gere must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
mod_id=simplekeybinds
mod_version=1.4.6
mod_name=Simple Keybinds
description=A Fabric/(Neo)Forge mod that adds simple(r) keybinds to Minecraft.
mod_author=Dillon8775
credits=Dillon8775
license=All rights reserved unless explicitly stated.
logo=assets/simplekeybinds/icon
mc_version=mc26.3
supported_mc_versions=26.3
# Use "-alpha.# for snapshots, "-pre.# for pre-releases
minecraft_version_range=>=26.3-pre.3 <26.4
group=net.dillon.simplekeybinds

# Links
homepage=https://modrinth.com/mod/simple-keybinds
sources=https://github.com/Dillon8775/Simple-Keybinds
issues=https://github.com/Dillon8775/Simple-Keybinds/issues
discord=https://discord.gg/vfqEAn4YFy

# Common
java_version=25
minecraft_version=26.3-pre-3
devauth_enabled=1

# This is the version of Minecraft that the 'common' directory uses
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-pre-3-1

